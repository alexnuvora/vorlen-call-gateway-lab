name: Build Lab APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Fetch pinned JemRec
        run: |
          rm -rf third_party/JemRec
          git clone https://github.com/jemcik/JemRec.git third_party/JemRec
          cd third_party/JemRec
          git checkout 25ad00e17e96de0cc3804dc575e543294fdb885e
          cd ../..
          python3 tools/patch_jemrec_uplink.py
      - name: Make build scripts executable
        run: |
          chmod +x gradlew
          chmod +x third_party/JemRec/shellserver/build.sh
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vorlen-call-gateway-lab-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
